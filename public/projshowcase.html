<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjeX - Project Showcase Portal</title>
    <!-- Link to the combined CSS file for this page -->
    <link rel="stylesheet" href="projshowcase.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Section (consistent across pages) -->
        <header>
            <div class="logo">
                <img src="logo-img.png" alt="ProjeX Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button><img src="search-icon.png" alt="Search"></button>
            </div>
            <div class="language">
                <span>English (United States)</span>
            </div>
        </header>

        <!-- Main Content Area with Sidebar -->
        <div class="main-content-area">
            <!-- Sidebar (consistent across pages) -->
            <div class="sidebar" id="sidebar">
                <button class="toggle-btn" id="sidebarToggle">☰</button>
                <div class="top-bar-heading">
                    <h2>ProjeX</h2>
                </div>
        
                <div class="profile-section">
                    <img src="logo-img.png" alt="Profile Picture" class="profile-pic-sidebar">
                </div>
                    
                <div class="username">
                    <h2>Username</h2>
                </div>
                   
                <nav class="nav-menu">
                    <a href="user.html">My Profile</a>
                    <a href="project.html">My Projects</a>
                    <a href="projshowcase2.html">Project Portal</a> <!-- This page -->
                    <a href="progress-tracker.html">Progress Tracker</a>
                    <a href="portfolio-maker.html">Portfolio Generator</a>
                    <a href="#">Code Collaboration Tool</a>
                </nav>
            </div>

            <!-- Project Showcase Portal Specific Content -->
            <div class="projshowcase-content">
                <h1 class="projshowcase-title">PROJECT SHOWCASE PORTAL</h1>

                <div class="projshowcase-navigation">
                    <button class="active">Explore</button>
                    <button>Categories</button>
                    <button>Trending</button>
                    <button>Favourite</button>
                </div>

                <div class="projshowcase-filters">
                    <div class="filter-group">
                        <label for="project-type">Select project type</label>
                        <select id="project-type">
                            <option>--Select--</option>
                            <option>Web Development</option>
                            <option>Mobile App Development</option>
                            <option>Data Science</option>
                            <option>Machine Learning</option>
                            <option>Game Development</option>
                            <option>IoT (Internet of Things)</option>
                            <option>Blockchain</option>
                            <option>Cybersecurity</option>
                            <option>Artificial Intelligence</option>
                            <option>Embedded Systems</option>
                            <option>Cloud Computing</option>
                            <option>DevOps</option>
                            <option>UI/UX Design</option>
                            <option>AR/VR Development</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="industry">Select industry</label>
                        <select id="industry">
                            <option>--Select--</option>
                            <option>Healthcare</option>
                            <option>Finance</option>
                            <option>Education</option>
                            <option>E-commerce</option>
                            <option>Automotive</option>
                            <option>Entertainment</option>
                            <option>Real Estate</option>
                            <option>Energy</option>
                            <option>Telecommunications</option>
                            <option>Logistics and Supply Chain</option>
                            <option>Retail</option>
                            <option>Manufacturing</option>
                            <option>Travel and Hospitality</option>
                            <option>Agriculture</option>
                            <option>Media and Advertising</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="difficulty-level">Select difficulty level</label>
                        <select id="difficulty-level">
                            <option>--Select--</option>
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                            <option>Expert</option>
                            <option>Professional</option>
                            <option>Capstone</option>
                            <option>Bootcamp</moption>
                            <option>Hackathon</option>
                            <option>Research</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="location">Select location</label>
                        <select id="location">
                            <option>--Select--</option>
                            <option>North America</option>
                            <option>Europe</option>
                            <option>Asia</option>
                            <option>South America</option>
                            <option>Africa</option>
                            <option>Australia</option>
                            <option>Remote/Global</option>
                            <option>United States</option>
                            <option>Canada</option>
                            <option>India</option>
                            <option>Germany</option>
                            <option>New York</option>
                            <option>London</option>
                            <option>Berlin</option>
                            <option>Bangalore</option>
                        </select>
                    </div>
                </div>
                <!-- Button to apply filters -->
                <button class="search-projects-btn">Search Projects</button>

                <!-- Add these new elements for project results and loading -->
                <div id="loadingIndicator" style="display: none; text-align: center; margin-top: 50px;">
                    <p style="font-size: 1.2em; color: #555;">Loading projects...</p>
                    <!-- You can add a CSS spinner here for better visuals -->
                </div>
                <div id="projectResults" class="results-grid">
                    <!-- Project cards will be dynamically loaded here -->
                    <p class="no-results-message">Use the filters and search to find projects.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="firebase-init.js"></script> <!-- LINK THIS FIRST -->
    <script src="landing-scripts.js"></script> <!-- Re-use landing page script for sidebar toggle -->
    <script src="projshowcase2-scripts.js"></script> <!-- Script for this page's functionality -->
</body>
</html>
