<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjeX - Progress Tracker</title>
    <!-- Link to the combined CSS file for this page -->
    <link rel="stylesheet" href="progress-tracker.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Section (consistent across pages) -->
        <header>
            <div class="logo">
                <img src="logo-img.png" alt="ProjeX Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button><img src="search-icon.png" alt="Search"></button>
            </div>
            <div class="language">
                <span>English (United States)</span>
            </div>
        </header>

        <!-- Main Content Area with Sidebar -->
        <div class="main-content-area">
            <!-- Sidebar (consistent across pages) -->
            <div class="sidebar" id="sidebar">
                <button class="toggle-btn" id="sidebarToggle">☰</button>
                <div class="top-bar-heading">
                    <h2>ProjeX</h2>
                </div>
        
                <div class="profile-section">
                    <img src="logo-img.png" alt="Profile Picture" class="profile-pic-sidebar">
                </div>
                    
                <div class="username">
                    <h2>Username</h2>
                </div>
                   
                <nav class="nav-menu">
                    <a href="user.html">My Profile</a>
                    <a href="project.html">My Projects</a>
                    <a href="projshowcase.html">Project Portal</a>
                    <a href="progress-tracker.html">Progress Tracker</a> <!-- This page -->
                    <a href="portfolio-maker.html">Portfolio Generator</a>
                    <a href="#">Code Collaboration Tool</a>
                </nav>
                <button class="logout-button" id="logoutButtonSidebar">LOG OUT</button> <!-- Logout button is now part of the main sidebar -->
            </div>

            <!-- Progress Tracker Specific Content -->
            <div class="progress-tracker-content">
                <h1 class="page-title"><span class="textual">Project Progress & Objectives</span></h1>

                <div class="progress-container">
                    <h2><span class="textual">Overall Progress</span></h2>
                    <div class="progress-bar"> <!-- Changed class from progress-bar-outer -->
                        <div id="progress" class="progress" style="width: 0%;"></div> <!-- Changed class from progress-bar-inner -->
                    </div>
                    <p class="progress-percentage">0% Complete</p>
                </div>

                <div class="todo-container">
                    <h2><span class="textual">Project Objectives</span></h2>
                    <div class="task-input-group">
                        <input type="text" id="task-input" placeholder="Enter a new task" />
                        <input type="date" id="date-input" />
                        <button id="add-task-btn">Add Task</button>
                    </div>
                    <ul id="todo-list"></ul>
                </div>
                
                <div class="movingImage"> <!-- Changed class from moving-image-container -->
                    <img src="dc1ruu1-88bffd7d-6633-4282-b361-b065697f36d7.gif" alt="Animated illustration of progress">
                </div>
            </div>
        </div>
    </div>
    <script src="firebase-init.js"></script> <!-- LINK THIS FIRST -->
    <script src="landing-scripts.js"></script> <!-- Re-use landing page script for sidebar toggle -->
    <script src="progress-tracker-scripts.js"></script> <!-- New script for this page's functionality -->
</body>
</html>
