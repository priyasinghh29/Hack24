<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjeX - Portfolio Generator</title>
    <!-- Link to the combined CSS file for this page -->
    <link rel="stylesheet" href="portfolio-maker.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Section (consistent across pages) -->
        <header>
            <div class="logo">
                <img src="logo-img.png" alt="ProjeX Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button><img src="search-icon.png" alt="Search"></button>
            </div>
            <div class="language">
                <span>English (United States)</span>
            </div>
        </header>

        <!-- Main Content Area with Sidebar -->
        <div class="main-content-area">
            <!-- Sidebar (consistent across pages) -->
            <div class="sidebar" id="sidebar">
                <button class="toggle-btn" id="sidebarToggle">☰</button>
                <div class="top-bar-heading">
                    <h2>ProjeX</h2>
                </div>
        
                <div class="profile-section">
                    <img src="logo-img.png" alt="Profile Picture" class="profile-pic-sidebar">
                </div>
                    
                <div class="username">
                    <h2>Username</h2>
                </div>
                   
                <nav class="nav-menu">
                    <a href="user.html">My Profile</a>
                    <a href="project.html">My Projects</a>
                    <a href="projshowcase2.html">Project Portal</a>
                    <a href="progress-tracker.html">Progress Tracker</a>
                    <a href="portfolio-maker.html">Portfolio Generator</a> <!-- This page -->
                    <a href="#">Code Collaboration Tool</a>
                </nav>

                <button class="logout-button" id="logoutButtonSidebar">LOG OUT</button> <!-- Logout button is now part of the main sidebar -->
            </div>

            <!-- Portfolio Generator Specific Content -->
            <div class="portfolio-generator-content">
                <h1 class="page-title">Automatic Portfolio Generator</h1>

                <div class="container">
                    <div class="projects-list">
                        <h2>Select Projects to Include</h2>
                        <div class="project-item">
                            <input type="checkbox" id="project1" data-title="E-commerce Website" data-description="A fully responsive e-commerce website built with React and Node.js, featuring a custom admin panel, payment gateway integration, and product management." data-image="https://placehold.co/400x250/009688/ffffff?text=E-commerce+Website" data-link="https://www.example.com/ecommerce">
                            <label for="project1">E-commerce Website</label>
                        </div>
                        <div class="project-item">
                            <input type="checkbox" id="project2" data-title="Mobile App Design" data-description="A sleek and modern mobile app design created using Figma, focusing on user experience and intuitive navigation for a food delivery service." data-image="https://placehold.co/400x250/FF5722/ffffff?text=Mobile+App+Design" data-link="https://www.example.com/mobileapp">
                            <label for="project2">Mobile App Design</label>
                        </div>
                        <div class="project-item">
                            <input type="checkbox" id="project3" data-title="Portfolio Website" data-description="A personal portfolio website built using HTML, CSS, and JavaScript, showcasing a variety of web development and design projects." data-image="https://placehold.co/400x250/4CAF50/ffffff?text=Portfolio+Website" data-link="https://www.example.com/portfolio">
                            <label for="project3">Portfolio Website</label>
                        </div>
                        <div class="project-item">
                            <input type="checkbox" id="project4" data-title="Marketing Landing Page" data-description="A high-converting marketing landing page designed for a SaaS company, featuring A/B testing and analytics integration." data-image="https://placehold.co/400x250/2196F3/ffffff?text=Marketing+Landing+Page" data-link="https://www.example.com/landingpage">
                            <label for="project4">Marketing Landing Page</label>
                        </div>
                        <!-- Add more projects as needed -->
                    </div>

                    <div class="portfolio">
                        <h2>Generated Portfolio</h2>
                        <div id="portfolioContent">
                            <p class="placeholder-text">Select projects from the left and click 'Generate Portfolio'.</p>
                        </div>
                    </div>
                </div>

                <button class="generate-portfolio-btn">Generate Portfolio</button>

                <div class="link-container" id="portfolioLinkContainer"></div>
            </div>
        </div>
    </div>
    <script src="firebase-init.js"></script> <!-- LINK THIS FIRST -->
    <script src="landing-scripts.js"></script> <!-- Re-use landing page script for sidebar toggle -->
    <script src="portfolio-maker-scripts.js"></script> <!-- New script for this page's functionality -->
</body>
</html>
