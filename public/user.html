<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjeX - My Profile</title>
    
    <!-- Link to user-profile.css for specific profile page content styles -->
    <link rel="stylesheet" href="user-profile.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Section (consistent with other pages) -->
        <header>
            <div class="logo">
                <img src="logo-img.png" alt="ProjeX Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button><img src="search-icon.png" alt="Search"></button>
            </div>
            <div class="language">
                <span>English (United States)</span>
            </div>
        </header>

        <!-- Main Content Area with Sidebar -->
        <div class="main-content-area">
            <!-- Sidebar (consistent with landing page) -->
            <div class="sidebar" id="sidebar">
                <button class="toggle-btn" id="sidebarToggle">☰</button>
                <div class="top-bar-heading">
                    <h2>ProjeX</h2>
                </div>
        
                <div class="profile-section">
                    <img src="logo-img.png" alt="Profile Picture" class="profile-pic-sidebar">
                </div>
                    
                <div class="username" id="sidebarUsername">
                    <h2>Username</h2> <!-- This will be updated dynamically -->
                </div>
                   
                <nav class="nav-menu">
                    <a href="user.html">My Profile</a>
                    <a href="project.html">My Projects</a>
                    <a href="projshowcase.html">Project Portal</a>
                    <a href="progress-tracker.html">Progress Tracker</a>
                    <a href="portfolio-maker.html">Portfolio Generator</a>
                    <a href="#">Code Collaboration Tool</a>
                </nav>
                <button class="logout-button" id="logoutButtonSidebar">LOG OUT</button> <!-- Logout button is now part of the main sidebar -->
            </div>

            <!-- Profile Content Section -->
            <div class="profile-page-content">
                <div class="profile-header-section">
                    <div class="background-image">
                        <!-- This is the background image section -->
                    </div>
                    <div class="user-details-overlay">
                        <div class="user-image-container">
                            <div class="profile-pic-main">
                                <img src="profile.png" alt="Profile Picture">
                            </div>
                        </div>
                        <div class="profile-details">
                            <h1 id="profileFullName">Jane Margarita</h1> <!-- Added ID -->
                            <h2 id="profileProfession">Project Manager @XYZ</h2> <!-- Added ID -->
                            <p class="location" id="profileLocation">New Delhi</p> <!-- Added ID -->
                            <p class="username-handle" id="profileHandle">@janemargarita</p> <!-- Added ID -->
                        </div>
                    </div>
                </div>

                <div class="profile-body-section">
                    <main class="profile-form-area">
                        <form id="profileUpdateForm">
                            <div class="form-group">
                                <label for="contact">Contact:</label>
                                <input type="text" id="contact" name="contact">
                            </div>

                            <div class="form-group">
                                <label for="profession">Profession:</label>
                                <input type="text" id="profession" name="profession">
                            </div>

                            <div class="form-group">
                                <label for="linkedin">LinkedIn Link:</label>
                                <input type="url" id="linkedin" name="linkedin">
                            </div>

                            <div class="form-group">
                                <label for="github">GitHub Link:</label>
                                <input type="url" id="github" name="github">
                            </div>

                            <div class="form-group">
                                <label for="skills">Skills:</label>
                                <input type="text" id="skills" name="skills" placeholder="node.js, html/css, FIGMA, ML, NLP">
                            </div>

                            <button type="submit" class="save-changes-button">Save Changes</button>
                        </form>
                    </main>
                </div>
            </div>
        </div>
    </div>
    <script src="firebase-init.js"></script> <!-- LINK THIS FIRST -->
    <script src="landing-scripts.js"></script> <!-- Re-use landing page script for sidebar toggle and logout -->
    <script src="user-profile-scripts.js"></script> <!-- Script for profile page specific functionality -->
</body>
</html>
